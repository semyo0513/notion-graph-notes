name: sync-deploy

on:
  schedule:
    - cron: '23,53 * * * *'      # 30분 간격 (정각 회피)
  workflow_dispatch:              # 수동 실행 (Actions 탭에서 즉시 동기화)
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 이전 "암호화된" 산출물 복원 (증분 빌드 캐시)
      - name: Restore encrypted cache
        uses: actions/cache@v4
        with:
          path: dist/data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Sync Notion Data & Encrypt
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATA_SOURCE_ID: ${{ secrets.DATA_SOURCE_ID }}
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
        run: node scripts/sync.mjs

      - name: Copy web assets to dist
        run: |
          mkdir -p dist
          cp -r web/* dist/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
