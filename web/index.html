<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Graph Notes</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- 고정 버전 CDN 의존성 -->
  <script src="https://unpkg.com/force-graph@1.43.5/dist/force-graph.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.2/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flexsearch@0.7.31/dist/flexsearch.bundle.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- 그래프 캔버스 컨테이너 -->
    <div id="graph-container"></div>

    <!-- 상단 툴바 / 컨트롤 -->
    <nav class="top-nav">
      <div class="brand-section">
        <svg class="brand-icon" viewBox="0 0 24 24">
          <circle cx="6" cy="6" r="3" />
          <circle cx="18" cy="6" r="3" />
          <circle cx="12" cy="18" r="3" />
          <path d="M8.5 7.5l7 0M7.5 8.5l3.5 7M16.5 8.5l-3.5 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="brand-title">Notion Graph Notes</span>
        <span class="badge" title="전체 노트 수"><span id="node-count">0</span> Notes</span>
      </div>

      <div class="controls-section">
        <!-- 검색창 -->
        <div class="search-box">
          <input type="text" id="search-input" placeholder="검색 (제목, 내용, 태그...)" autocomplete="off">
          <button id="search-clear" class="search-clear" title="검색 지우기">✕</button>
        </div>

        <!-- 폴더 필터 -->
        <select id="folder-filter" class="filter-select">
          <option value="">모든 폴더</option>
        </select>

        <!-- 태그 필터 -->
        <select id="tag-filter" class="filter-select">
          <option value="">모든 태그</option>
        </select>

        <!-- 확대/축소 및 뷰 리셋 -->
        <button id="btn-zoom-in" class="btn-icon" title="확대">+</button>
        <button id="btn-zoom-out" class="btn-icon" title="축소">−</button>
        <button id="btn-reset-view" class="btn-icon" title="화면 중앙 맞춤">⊙</button>

        <!-- 세션 잠금(로그아웃) -->
        <button id="btn-lock" class="btn-icon" title="다시 잠그기 (로그아웃)">🔒</button>
      </div>
    </nav>

    <!-- 좌측 하단 정보 HUD -->
    <div class="graph-hud">
      <div class="hud-item">연결선: <strong id="edge-count">0</strong></div>
      <div class="hud-item">최근 동기화: <strong id="last-sync-time">-</strong></div>
    </div>

    <!-- 우측 슬라이딩 사이드바 (노트 열람) -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title-area">
          <div class="sidebar-meta-tags"></div>
          <h2 class="sidebar-title">노트 제목</h2>
        </div>
        <button class="sidebar-close" title="닫기 (ESC)">✕</button>
      </div>

      <div class="sidebar-body">
        <!-- 마크다운 렌더링 영역 -->
      </div>

      <div class="sidebar-footer">
        <span class="sidebar-date"></span>
        <a href="#" target="_blank" rel="noopener noreferrer" class="btn-notion">
          <span>Notion에서 열기</span> ↗
        </a>
      </div>
    </aside>

    <!-- 잠금 해제 모달 대화상자 (프록시 불필요, 오직 비밀번호 하나만 입력) -->
    <div id="unlock-modal" class="modal-overlay">
      <div class="unlock-card">
        <div class="unlock-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h2 class="unlock-title">암호화된 지식창고</h2>
        <p class="unlock-desc">
          저장소의 데이터는 AES-256-GCM으로 안전하게 암호화되어 있습니다.<br>
          노트를 복호화할 <strong>패스프레이즈(비밀번호)</strong>를 입력하세요.
        </p>

        <form id="unlock-form" class="unlock-form">
          <input
            type="password"
            id="passphrase-input"
            class="passphrase-input"
            placeholder="패스프레이즈(비밀번호) 입력"
            required
            autocomplete="current-password"
            autofocus
          >

          <label class="remember-checkbox">
            <input type="checkbox" id="remember-passphrase">
            <span>이 기기의 브라우저에 저장 (다음 방문 시 자동 로그인)</span>
          </label>

          <button type="submit" id="btn-unlock" class="btn-submit">
            노트 잠금 해제
          </button>
        </form>

        <div id="unlock-error" class="unlock-error" style="text-align:left; white-space:pre-wrap; line-height:1.5;"></div>
      </div>
    </div>

    <!-- 토스트 메시지 컨테이너 -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script type="module" src="js/app.js?v=20261028_1"></script>
</body>
</html>
